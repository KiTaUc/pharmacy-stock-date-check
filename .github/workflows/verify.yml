name: Проверка

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Запустить тесты
        run: python -m unittest discover -s tests -v
      - name: Проверить компиляцию
        run: python -m compileall src
